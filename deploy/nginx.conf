# Atlantic Ave Cruisers — nginx site config for EC2 (Ubuntu 24.04 + PHP 8.3-FPM).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/atlantic
#   sudo ln -s /etc/nginx/sites-available/atlantic /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY.md) — it rewrites this file to add TLS.

server {
    listen 80;
    listen [::]:80;

    server_name atlanticavecruisers.com www.atlanticavecruisers.com;

    # Laravel serves from public/, never the project root.
    root /var/www/atlantic/current/public;
    index index.php;

    charset utf-8;

    # Vite fingerprints every asset in build/, so they can cache forever.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git) — except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
